help: |
  本插件为“我会永远陪着你”提供独立创作、书柜和 QQ 空间能力。安装并启用后，创作项目的生成、续写、审校、记忆整理、作品封面和 QQ 空间操作会通过扩展 API 接入。

  旧版创作配置和 creative_projects 数据仍由陪伴主插件兼容读取，无需重新建立作品。

help: |
  此插件为“我会永远陪着你”插件的拓展程序，请到其拓展页进行配置。

  本插件为“我会永远陪着你”提供创作、书柜和 QQ 空间能力。安装并启用后，创作项目的生成、续写、审校、记忆整理、作品封面和 QQ 空间操作会通过扩展 API 接入陪伴面板。

  旧版创作配置和 creative_projects 数据仍由陪伴主插件兼容读取，无需重新建立作品。本扩展不提供独立页面或脱离陪伴主插件的运行入口。
